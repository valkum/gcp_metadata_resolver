[package]
name = "gcp_metadata_resolver"
version = "0.5.0"
edition = "2024"
description = "Helper utility to identify the Monitored Resource inside Google Cloud Platform"
repository = "https://github.com/valkum/gcp_metadata_resolver"
license = "MIT OR Apache-2.0"


[dependencies]
hyper = { version = "1", default-features = false, features = [
    "client",
    "http1",
] }
hyper-util = { version = "0.1", features = [
    "client",
    "client-legacy",
    "http1",
] }
http-body-util = "0.1"
thiserror = "2"
opentelemetry-stackdriver = { version = "0.29", optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
regex = "1"
tokio = { version = "1", default-features = false, features = ["macros"] }
tracing = "0.1"
async-once-cell = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[features]
default = []
# Convert `MonitoredResource` into the deprecated `opentelemetry-stackdriver`
# type. Off by default so the deprecated crate stays out of the graph.
stackdriver = ["dep:opentelemetry-stackdriver"]
# Convert `GcpResourceAttributes` into OpenTelemetry SDK types, for an OTLP
# exporter that targets the Google Telemetry API.
opentelemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
